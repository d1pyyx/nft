services:
  - type: web
    name: gift-changes-bot
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        sync: false
